[project]
name = "api"
version = "0.1.0"
description = "Helix backend: FastAPI host for the agent pipeline."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyGithub>=2.4",
    "posthog>=3.7",
    "supabase>=2.10",
    "python-dotenv>=1.0",
    "scipy>=1.14",
    "numpy>=2.1",
    "httpx>=0.28",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
